# CD: main에 푸시되면 테스트 → Docker 이미지 빌드·Docker Hub 푸시 → EC2에서 새 이미지로 재시작
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions)
#   DOCKERHUB_USERNAME  Docker Hub 아이디
#   DOCKERHUB_TOKEN     Docker Hub 액세스 토큰 (Account settings → Personal access tokens, Read & Write)
#   EC2_HOST            EC2 퍼블릭 IP 또는 도메인
#   EC2_USERNAME        EC2 로그인 사용자 (Ubuntu: ubuntu / Amazon Linux: ec2-user)
#   EC2_SSH_KEY         EC2 접속용 .pem 키 파일의 전체 내용
#   ENV_FILE            서버에서 쓸 .env 전체 내용 (DB_PW, JWT_SECRET, AWS_*, GEMINI_*, KAKAO_REST_KEY 등)
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Actions 탭에서 수동 실행도 가능

# 기본 토큰 권한은 읽기만 (저장소를 수정할 수 없게)
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false   # 배포 도중에 다음 배포가 끼어들지 않게 순서대로 실행

env:
  IMAGE_NAME: sos-map-backend
  DEPLOY_DIR: sos-map   # EC2 홈 디렉터리 아래 배포 폴더

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 + Docker Hub 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64   # EC2가 ARM(t4g 등)이면 linux/arm64 로 바꾼다
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: docker-compose.yml 을 EC2로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: EC2에서 새 이미지로 재시작
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,IMAGE_NAME,DEPLOY_DIR
          # 첫 배포는 이미지(앱 + MySQL) 다운로드가 오래 걸린다. 기본값 10분이면 부족할 수 있다.
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd ~/"$DEPLOY_DIR"

            # .env 는 GitHub Secret 으로만 관리한다 (서버에서 직접 수정하지 않음)
            umask 077
            printf '%s\n' "$ENV_FILE" > .env
            printf 'DOCKER_IMAGE=%s/%s\nIMAGE_TAG=%s\n' "$DOCKERHUB_USERNAME" "$IMAGE_NAME" "$IMAGE_TAG" >> .env

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull app
            docker logout   # 토큰이 서버(~/.docker/config.json)에 남지 않게
            docker compose up -d --no-build
            docker image prune -f

            # 서버가 뜰 때까지 최대 3분 대기 (작은 EC2는 Spring 기동이 느릴 수 있다)
            for i in $(seq 1 36); do
              if docker compose logs app 2>&1 | grep -q "Started SosMapApplication"; then
                echo "배포 성공: $IMAGE_TAG"; exit 0
              fi
              sleep 5
            done
            echo "서버가 3분 안에 시작되지 않았습니다. 최근 로그:"
            docker compose logs --tail 80 app
            exit 1
