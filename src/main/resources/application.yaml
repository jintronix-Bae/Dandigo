spring:
  application:
    name: SOS_map
  config:
    # 프로젝트 최상위의 .env 파일을 읽는다. 없으면(배포 서버 등) 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PW}
  jpa:
    hibernate:
      # update: 없는 테이블·컬럼만 추가하고 데이터는 지우지 않는다. (로컬에서 초기화하려면 .env에 JPA_DDL_AUTO=create)
      ddl-auto: ${JPA_DDL_AUTO:update}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB   # 파일 10MB + multipart 구분자 여유

server:
  # Caddy(HTTPS) 뒤에서 동작하므로, Caddy가 넘겨준 원래 주소(https, 도메인)를 기준으로 리다이렉트·URL을 만든다
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_EXPIRATION}

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}
  # 비어 있으면 기본 자격 증명(EC2 역할 등)을 사용한다.
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

kakao:
  # 좌표 → 행정구역(지역 이름표). 비어 있으면 주소 문자열로 판단한다.
  rest-key: ${KAKAO_REST_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
  # 이미지 생성은 보통 15~20초, 느리면 1분 이상 걸릴 수 있어 넉넉하게 둔다
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:120}
