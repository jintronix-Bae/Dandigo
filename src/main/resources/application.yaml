spring:
  application:
    name: SOS_map
  config:
    # 프로젝트 최상위의 .env 파일을 읽는다. 없으면(배포 서버 등) 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PW}
  jpa:
    hibernate:
      ddl-auto: create
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_EXPIRATION}

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}
  # 비어 있으면 기본 자격 증명(EC2 역할 등)을 사용한다.
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}

kakao:
  # 좌표 → 행정구역(지역 이름표). 비어 있으면 주소 문자열로 판단한다.
  rest-key: ${KAKAO_REST_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
  timeout-seconds: 60
